<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c96442">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Mera AI</title>
<style>
:root{--bg:#faf9f5;--fg:#1f1e1d;--mut:#73726c;--card:#fff;--user:#efece3;--acc:#c96442;--bd:#e5e2d9;--code:#f0eee6}
:root[data-theme="dark"]{--bg:#262624;--fg:#f3f1ea;--mut:#a3a199;--card:#30302e;--user:#3a3936;--bd:#44433f;--code:#1f1e1d}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI","Noto Nastaliq Urdu",sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd)}
header b{flex:1;font-size:17px}
.ib{width:38px;height:38px;border-radius:10px;font-size:19px}
.ib:active{background:var(--user)}
select{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:4px;font:inherit;font-size:13px;max-width:92px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.empty{margin:auto;text-align:center;color:var(--mut)}
.empty h2{color:var(--fg);margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:6px 12px;font-size:14px}
.m{max-width:94%;word-wrap:break-word;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--user);padding:8px 14px;border-radius:16px;white-space:pre-wrap}
.m.a{align-self:flex-start}
.m.err{color:#c0392b}
.m img{max-width:200px;max-height:200px;border-radius:10px;display:block;margin-bottom:6px}
.m p{margin:0 0 8px}.m ul{margin:0 0 8px;padding-inline-start:22px}
.m code{background:var(--code);padding:1px 5px;border-radius:5px;font-size:.9em}
.cb{background:var(--code);border-radius:10px;margin:6px 0;overflow:hidden}
.cb div{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);padding:4px 10px;border-bottom:1px solid var(--bd)}
.cb pre{margin:0;padding:10px;overflow-x:auto;font-size:13px;direction:ltr;text-align:left}
.cb pre code{background:none;padding:0}
.tools{display:flex;gap:4px;margin-top:2px}
.tools button{font-size:14px;color:var(--mut);padding:2px 6px}
#att{display:flex;gap:8px;padding:0 12px;flex-wrap:wrap}
.at{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:4px 8px;font-size:12px;margin-top:6px}
.at img{height:44px;border-radius:6px;display:block}
.at b{position:absolute;top:-6px;right:-6px;background:var(--acc);color:#fff;border-radius:50%;width:18px;height:18px;text-align:center;line-height:18px;font-size:12px;cursor:pointer}
form{display:flex;align-items:flex-end;gap:6px;padding:10px 12px}
textarea{flex:1;resize:none;max-height:140px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:16px;padding:10px 12px;font:inherit}
#send{background:var(--acc);color:#fff;border-radius:50%;width:42px;height:42px;font-size:18px}
#mic.on{background:#e74c3c33}
#side{position:fixed;inset:0;display:none;z-index:9}
#side.open{display:flex}
#panel{width:80%;max-width:320px;background:var(--bg);border-inline-end:1px solid var(--bd);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#shade{flex:1;background:#0006}
#list{flex:1;overflow-y:auto;padding:6px}
.ci{display:flex;align-items:center;border-radius:10px;padding:2px 4px}
.ci.cur{background:var(--user)}
.ci span{flex:1;padding:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ci button{color:var(--mut);padding:6px}
#newc{margin:10px;background:var(--acc);color:#fff;border-radius:10px;padding:10px}
</style>
</head>
<body>
<header>
  <button class="ib" id="menu" title="History">☰</button>
  <b>✺ Mera AI</b>
  <select id="lang" title="Voice language">
    <option value="ur-PK">اردو</option><option value="hi-IN">हिन्दी</option><option value="en-US">English</option>
    <option value="ar-SA">العربية</option><option value="pa-IN">ਪੰਜਾਬੀ</option><option value="bn-BD">বাংলা</option>
    <option value="es-ES">Español</option><option value="fr-FR">Français</option>
  </select>
  <button class="ib" id="theme" title="Dark/Light">◐</button>
</header>
<div id="log"></div>
<div id="att"></div>
<form id="f">
  <button type="button" class="ib" id="clip" title="Tasveer / file">📎</button>
  <button type="button" class="ib" id="mic" title="Bolein">🎤</button>
  <textarea id="t" rows="1" dir="auto" placeholder="Kuch bhi poochein…"></textarea>
  <button type="submit" id="send">➤</button>
</form>
<input type="file" id="file" hidden multiple accept="image/*,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.java,.c,.cpp,.xml,.log">
<div id="side"><div id="panel"><button id="newc">+ Naya chat</button><div id="list"></div></div><div id="shade"></div></div>

<script>
const $=id=>document.getElementById(id);
const log=$('log'),t=$('t'),send=$('send'),att=$('att');
const store=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
let chats=store('chats')||[],cur=null,busy=false,ctrl=null,files=[];
const SUGG=["Mujhe ek kahani sunao","Email likhne mein madad karo","Python seekhna hai"];

/* theme */
function applyTheme(m){document.documentElement.dataset.theme=m}
applyTheme(store('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('theme').onclick=()=>{const m=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme(m);store('theme',m)};
$('lang').value=store('lang')||'ur-PK';$('lang').onchange=()=>store('lang',$('lang').value);

/* markdown (safe) */
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')}
function md(src){
  const parts=src.split(/```/);let out='';
  parts.forEach((p,i)=>{
    if(i%2){const nl=p.indexOf('\n');const lang=nl>-1?p.slice(0,nl).trim():'';const code=nl>-1?p.slice(nl+1):p;
      out+='<div class="cb"><div><span>'+esc(lang||'code')+'</span><button data-copy>Copy</button></div><pre><code>'+esc(code.replace(/\n$/,''))+'</code></pre></div>'}
    else{let list=false;p.split('\n').forEach(l=>{
      const li=l.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
      if(li){if(!list){out+='<ul>';list=true}out+='<li>'+inline(li[1])+'</li>'}
      else{if(list){out+='</ul>';list=false}
        const h=l.match(/^#{1,3}\s+(.*)/);
        if(h)out+='<p><b>'+inline(h[1])+'</b></p>';else if(l.trim())out+='<p>'+inline(l)+'</p>'}});
      if(list)out+='</ul>'}
  });return out}
document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b){navigator.clipboard.writeText(b.closest('.cb').querySelector('code').textContent);b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy',1200)}});

/* chat store */
const save=()=>store('chats',chats.slice(0,60));
function getCur(){return chats.find(c=>c.id===cur)}
function newChat(){cur=null;files=[];renderAtt();render();closeSide()}
function render(){
  log.innerHTML='';const c=getCur();
  if(!c||!c.msgs.length){log.innerHTML='<div class="empty"><div style="font-size:38px">✺</div><h2>Assalam o Alaikum!</h2><div>Main aap ki kya madad kar sakta hoon?</div><div class="chips"></div></div>';
    SUGG.forEach(s=>{const b=document.createElement('button');b.className='chip';b.textContent=s;b.onclick=()=>ask(s);log.querySelector('.chips').appendChild(b)});return}
  c.msgs.forEach(m=>bubble(m))}
function bubble(m){
  const d=document.createElement('div');d.className='m '+(m.role==='user'?'u':'a')+(m.err?' err':'');d.dir='auto';
  fill(d,m);log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function fill(d,m){
  d.innerHTML='';
  (m.images||[]).forEach(src=>{const i=document.createElement('img');i.src=src;d.appendChild(i)});
  if(m.role==='user'){const s=document.createElement('span');s.textContent=m.shown||m.content;d.appendChild(s)}
  else{const w=document.createElement('div');w.innerHTML=md(m.content||'…');d.appendChild(w);
    if(m.content&&!m.err){const tl=document.createElement('div');tl.className='tools';
      const sp=document.createElement('button');sp.textContent='🔊';sp.onclick=()=>speak(m.content);
      const cp=document.createElement('button');cp.textContent='⧉';cp.onclick=()=>{navigator.clipboard.writeText(m.content);cp.textContent='✓'};
      tl.append(sp,cp);d.appendChild(tl)}}}

/* sidebar */
function renderList(){
  const l=$('list');l.innerHTML='';
  chats.forEach(c=>{const r=document.createElement('div');r.className='ci'+(c.id===cur?' cur':'');
    const s=document.createElement('span');s.textContent=c.title;s.dir='auto';s.onclick=()=>{cur=c.id;render();closeSide()};
    const ed=document.createElement('button');ed.textContent='✎';ed.onclick=()=>{const n=prompt('Naya naam',c.title);if(n){c.title=n.slice(0,60);save();renderList()}};
    const dl=document.createElement('button');dl.textContent='🗑';dl.onclick=()=>{if(confirm('Delete karein?')){chats=chats.filter(x=>x!==c);if(cur===c.id)cur=null;save();render();renderList()}};
    r.append(s,ed,dl);l.appendChild(r)})}
const openSide=()=>{renderList();$('side').classList.add('open')},closeSide=()=>$('side').classList.remove('open');
$('menu').onclick=openSide;$('shade').onclick=closeSide;$('newc').onclick=newChat;

/* attachments */
$('clip').onclick=()=>$('file').click();
function renderAtt(){att.innerHTML='';files.forEach((f,i)=>{const d=document.createElement('div');d.className='at';
  if(f.img){const im=document.createElement('img');im.src=f.img;d.appendChild(im)}else d.append(f.name);
  const x=document.createElement('b');x.textContent='×';x.onclick=()=>{files.splice(i,1);renderAtt()};d.appendChild(x);att.appendChild(d)})}
$('file').onchange=async e=>{
  for(const f of e.target.files){
    if(f.type.startsWith('image/'))files.push({name:f.name,img:await shrink(f)});
    else if(f.size<200000)files.push({name:f.name,text:await f.text()});
    else alert(f.name+' bohat bari hai (200KB se kam rakhein).')}
  e.target.value='';renderAtt()};
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(file)})}

/* send */
async function ask(q){
  q=(q||'').trim();if((!q&&!files.length)||busy)return;
  let c=getCur();if(!c){c={id:Date.now()+'',title:(q||'Naya chat').slice(0,40),msgs:[]};chats.unshift(c);cur=c.id}
  if(!c.msgs.length)log.innerHTML='';
  const imgs=files.filter(f=>f.img).map(f=>f.img);
  const txt=files.filter(f=>f.text).map(f=>'\n\n[File: '+f.name+']\n'+f.text).join('');
  const um={role:'user',content:q+txt,shown:q||files.map(f=>f.name).join(', '),images:imgs};
  c.msgs.push(um);bubble(um);t.value='';t.style.height='auto';files=[];renderAtt();
  const am={role:'assistant',content:''};c.msgs.push(am);const el=bubble(am);
  busy=true;send.textContent='■';ctrl=new AbortController();
  const payload=c.msgs.slice(0,-1).filter(m=>!m.err).map(m=>m.images&&m.images.length?
    {role:m.role,content:[{type:'text',text:m.content||'Is tasveer ko dekhein.'},...m.images.map(u=>({type:'image_url',image_url:{url:u}}))]}:{role:m.role,content:m.content});
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:payload}),signal:ctrl.signal});
    if(!r.ok){let m='Server error';try{m=(await r.json()).error||m}catch(e){}throw new Error(m)}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const l of lines){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(!d||d==='[DONE]')continue;
        try{const j=JSON.parse(d);const dl=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
          if(dl){am.content+=dl;el.innerHTML='<div>'+md(am.content)+'</div>';log.scrollTop=log.scrollHeight}}catch(e){}}}
    if(!am.content)throw new Error('Khali jawab aaya. Dobara koshish karein.');
  }catch(e){
    if(e.name==='AbortError'){if(!am.content)c.msgs.pop()}
    else{am.err=true;am.content='Masla aa gaya: '+e.message}}
  fill(el,am);el.className='m a'+(am.err?' err':'');
  busy=false;send.textContent='➤';ctrl=null;save();log.scrollTop=log.scrollHeight}
$('f').onsubmit=e=>{e.preventDefault();if(busy&&ctrl){ctrl.abort();return}ask(t.value)};
t.oninput=()=>{t.style.height='auto';t.style.height=Math.min(t.scrollHeight,140)+'px'};
t.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&innerWidth>700){e.preventDefault();ask(t.value)}};

/* voice */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
$('mic').onclick=()=>{
  if(!SR){alert('Is browser mein voice input nahi hai. Chrome (Android) ya Safari try karein.');return}
  if(rec){rec.stop();return}
  rec=new SR();rec.lang=$('lang').value;rec.interimResults=true;rec.continuous=false;
  const base=t.value;$('mic').classList.add('on');
  rec.onresult=e=>{t.value=base+Array.from(e.results).map(r=>r[0].transcript).join('');t.oninput()};
  rec.onend=()=>{rec=null;$('mic').classList.remove('on')};rec.onerror=()=>{};rec.start()};
function speak(s){
  if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(s.replace(/```[\s\S]*?```/g,' code ').replace(/[*#`]/g,''));
  u.lang=$('lang').value;speechSynthesis.speak(u)}

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
render();
</script>
</body>
</html>
